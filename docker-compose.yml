services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:?VITE_PUBLIC_URL must point to the central MDM server}
        VITE_PANEL_MODE: shop
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    container_name: phone_seller_frontend
    restart: unless-stopped
    environment:
      # Markazdan beriladigan gateway kaliti (brauzerga chiqmaydi).
      SHOP_ID: ${SHOP_ID:?SHOP_ID must be issued by the central platform}
      SHOP_KEY: ${SHOP_KEY:?SHOP_KEY must be issued by the central platform}
      # Do'konning o'z domeni — shu domenga avtomatik Let's Encrypt SSL olinadi.
      SHOP_DOMAIN: ${SHOP_DOMAIN:?SHOP_DOMAIN must be set — this shop's own domain}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set}
      # 1 = Let's Encrypt staging (test, rate-limitsiz). Haqiqiy SSL uchun 0.
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Sertifikatlar restart'lar orasida saqlanadi (rate-limitdan himoya).
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  letsencrypt:
  certbot-webroot:
